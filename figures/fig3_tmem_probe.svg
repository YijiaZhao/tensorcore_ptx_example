ace" font-weight="bold">问题: 槽位s ↔ D的哪个(行,列)? 文档不可靠</text><text x="60" y="346" text-anchor="start" font-size="9" fill="#888" font-family="Menlo, Consolas, monospace">lane16-127: 灰色=本例窗口之外</text><text x="480" y="184" text-anchor="start" font-size="12" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">base-4 one-hot 探针: 让每个格子的值携带自己的坐标</text><rect x="480" y="200" width="70" height="38" rx="5" fill="#4E79A7"/><text x="515" y="224" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace" font-weight="bold">轮1-4</text><text x="562" y="215" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">A[m][0]=m的4进制第i位, B=1</text><text x="562" y="231" text-anchor="start" font-size="10" fill="#555" font-family="Menlo, Consolas, monospace">D值 = 行号的第i位 → 拼出行号</text><line x1="515" y1="238" x2="515" y2="252" stroke="#888" stroke-width="1.5"/><rect x="480" y="252" width="70" height="38" rx="5" fill="#4E79A7"/><text x="515" y="276" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace" font-weight="bold">轮5-8</text><text x="562" y="267" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">A=1, B[n][0]=n的4进制第i位</text><text x="562" y="283" text-anchor="start" font-size="10" fill="#555" font-family="Menlo, Consolas, monospace">D值 = 列号的第i位 → 拼出列号</text><line x1="515" y1="290" x2="515" y2="304" stroke="#888" stroke-width="1.5"/><rect x="480" y="304" width="70" height="38" rx="5" fill="#4E79A7"/><text x="515" y="328" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace" font-weight="bold">轮9</text><text x="562" y="319" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">A[m][0]=2×第0位</text><text x="562" y="335" text-anchor="start" font-size="10" fill="#555" font-family="Menlo, Consolas, monospace">读到2倍 = 真D槽位; 否则=TMEM残留, 过滤</text><rect x="480" y="358" width="560" height="30" rx="5" fill="#59A14B" fill-opacity="0.9"/><text x="760" y="377" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace" font-weight="bold">map[槽位] = (行,列) 测绘完成 → 随机数据按图逐bit对账</text></svg>