<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" fill="#ffffff"/><text x="20" y="24" text-anchor="start" font-size="14" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">wgmma/tcgen05 smem 排布 — 8行×16B core-matrix 瓷砖 (no-swizzle)</text><text x="60" y="56" text-anchor="start" font-size="11" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">逻辑矩阵 A[16行 × 32B/行] 切成4块瓷砖:</text><rect x="60" y="70" width="150" height="100" fill="#4E79A7" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="135.0" y="114.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(0,0)</text><text x="135.0" y="130.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">行0-7 · 前16B</text><rect x="210" y="70" width="150" height="100" fill="#F28E2B" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="285.0" y="114.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(0,1)</text><text x="285.0" y="130.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">行0-7 · 后16B</text><rect x="60" y="170" width="150" height="100" fill="#59A14B" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="135.0" y="214.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(1,0)</text><text x="135.0" y="230.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">行8-15 · 前16B</text><rect x="210" y="170" width="150" height="100" fill="#B07AA1" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="285.0" y="214.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(1,1)</text><text x="285.0" y="230.0" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">行8-15 · 后16B</text><text x="60" y="282" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">瓷砖内部 = 8行×16B 行主连续 (128B):</text><rect x="60" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.5" stroke="#fff"/><text x="79" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行0</text><rect x="98" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.56" stroke="#fff"/><text x="117" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行1</text><rect x="136" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.62" stroke="#fff"/><text x="155" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行2</text><rect x="174" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.6799999999999999" stroke="#fff"/><text x="193" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行3</text><rect x="212" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.74" stroke="#fff"/><text x="231" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行4</text><rect x="250" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.8" stroke="#fff"/><text x="269" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行5</text><rect x="288" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.86" stroke="#fff"/><text x="307" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行6</text><rect x="326" y="290" width="38" height="16" fill="#4E79A7" fill-opacity="0.9199999999999999" stroke="#fff"/><text x="345" y="302" text-anchor="middle" font-size="9" fill="#fff" font-family="Menlo, Consolas, monospace">行7</text><text x="60" y="324" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">16B/行 × 8行, 挨着放</text><text x="480" y="66" text-anchor="start" font-size="11" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">在内存(smem)里瓷砖的实际顺序:</text><rect x="480" y="90" width="140" height="40" fill="#4E79A7" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="550.0" y="115" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(0,0)</text><text x="480" y="146" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">0</text><rect x="620" y="90" width="140" height="40" fill="#F28E2B" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="690.0" y="115" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(0,1)</text><text x="620" y="146" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">128</text><rect x="760" y="90" width="140" height="40" fill="#59A14B" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="830.0" y="115" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(1,0)</text><text x="760" y="146" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">256</text><rect x="900" y="90" width="140" height="40" fill="#B07AA1" fill-opacity="0.85" stroke="#fff" stroke-width="2"/><text x="970.0" y="115" text-anchor="middle" font-size="11" fill="#fff" font-family="Menlo, Consolas, monospace">瓷砖(1,1)</text><text x="900" y="146" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">384</text><text x="1040" y="146" text-anchor="start" font-size="9" fill="#555" font-family="Menlo, Consolas, monospace">512</text><text x="480" y="170" text-anchor="start" font-size="11" fill="#333" font-family="Menlo, Consolas, monospace" font-weight="bold">K方向相邻瓷砖间距 LBO = 128B      M方向间距 SBO = 256B</text><text x="480" y="194" text-anchor="start" font-size="12" fill="#B0413E" font-family="Menlo, Consolas, monospace" font-weight="bold">addr(m,kb) = (m/8)*256 + (kb/16)*128 + (m%8)*16 + kb%16</text><text x="480" y="240" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">同一个元素在两种排布下的地址(为何全1.0查不出/(0,0)碰巧相同):</text><text x="480" y="260" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">元素(行m, 字节kb)</text><text x="670" y="260" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">线性行主</text><text x="780" y="260" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace" font-weight="bold">core-matrix</text><text x="480" y="278" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">(0, 0)</text><text x="670" y="278" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">0</text><text x="780" y="278" text-anchor="start" font-size="10" fill="#B0413E" font-family="Menlo, Consolas, monospace">0   ← 碰巧相同</text><text x="480" y="296" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">(1, 0)</text><text x="670" y="296" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">32</text><text x="780" y="296" text-anchor="start" font-size="10" fill="#B0413E" font-family="Menlo, Consolas, monospace">16  ← 第一行就分家</text><text x="480" y="314" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">(0, 16)</text><text x="670" y="314" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">16</text><text x="780" y="314" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">128</text><text x="480" y="332" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">(9, 20)</text><text x="670" y="332" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">308</text><text x="780" y="332" text-anchor="start" font-size="10" fill="#222" font-family="Menlo, Consolas, monospace">404</text><text x="60" y="410" text-anchor="start" font-size="11" fill="#B0413E" font-family="Menlo, Consolas, monospace">全1.0数据下怎么洗牌结果都“对” → 排布错误只有随机数据能暴露 (本仓库实测踩过)</text></svg>